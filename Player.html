<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Video Player</title>
  <link rel="stylesheet" href="player.css">

  <!-- Google Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Hammersmith+One&display=swap" rel="stylesheet">
</head>
<body>
  <div class="video-container">
    <video id="video" src="/(Sudah) - Kereta Berdarah.mp4" preload="metadata"></video>

    <!-- Header -->
    <div class="video-header">
      <a href="/middle.html"><span class="material-icons back-btn">arrow_back</span></a>
      <h3 class="video-title">The Conjuring (2013)</h3>
    </div>

    <!-- Controls -->
    <div class="controls">
      <!-- Progress -->
      <div class="progress-container">
        <input type="range" id="progress" value="0" min="0" max="100">
      </div>

      <div class="controls-row">
        <div class="time-display">
          <span id="currentTime">0:00</span><span>/</span><span id="duration">0:00</span>
        </div>


        <div class="control-buttons">
          <button id="rewind"><span class="material-icons">replay_10</span></button>
          <button id="playPause"><span class="material-icons">play_arrow</span></button>
          <button id="forward"><span class="material-icons">forward_10</span></button>
        </div>

        <div class="right-controls">
          <div class="volume-container"><button id="volumeBtn"><span class="material-icons">volume_up</span></button><div class="volume-slider-wrapper"><input type="range" id="volumeBar" min="0" max="1" step="0.05" value="1"></div></div>
          <button id="subtitle"><span class="material-icons">subtitles</span></button>
          <button id="cast"><span class="material-icons">cast</span></button>
          <button id="fullscreen"><span class="material-icons">fullscreen</span></button>
        </div>
      </div>
    </div>
  </div>

  <script src="player.js"></script>
</body>
</html>
